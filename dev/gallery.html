<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>itho-hru-card visual gallery</title>
    <style>
      /* HA-like theme tokens, scoped so several themes can be shown on one page. */
      .theme {
        --primary-color: #03a9f4;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --disabled-text-color: #bdbdbd;
        --divider-color: #e0e0e0;
        --secondary-background-color: #e5e5e5;
        --text-primary-color: #fff;
        --error-color: #db4437;
        --warning-color: #ffa600;
        --card-background-color: #fff;
        --ha-card-border-radius: 12px;
        --page-bg: #fafafa;
        background: var(--page-bg);
        color: var(--primary-text-color);
      }
      .theme-dark {
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --disabled-text-color: #6f6f6f;
        --divider-color: #3a3a3a;
        --secondary-background-color: #2c2c2c;
        --card-background-color: #1c1c1c;
        --page-bg: #111;
      }
      /* A custom theme with a different primary colour, like a user theme in HA. */
      .theme-custom {
        --primary-color: #ff9800;
        --text-primary-color: #fff;
        --page-bg: #efe9e1;
      }
      body {
        margin: 0;
        font-family:
          Roboto,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 16px;
        background: #fff;
        border-bottom: 1px solid #ddd;
        font-size: 13px;
      }
      header button {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid #bbb;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      header button[aria-pressed='true'] {
        background: #222;
        color: #fff;
        border-color: #222;
      }
      section.theme {
        padding: 16px;
        overflow-x: auto;
      }
      section.theme h2 {
        margin: 0 0 12px;
        font-size: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: 150px repeat(4, max-content);
        gap: 12px 16px;
        align-items: start;
      }
      .grid > .colhead {
        font-size: 11px;
        font-weight: 600;
        color: var(--secondary-text-color);
      }
      .grid > .rowhead {
        font-size: 12px;
        line-height: 16px;
        padding-top: 4px;
        color: var(--primary-text-color);
      }
      .rowhead small {
        display: block;
        color: var(--secondary-text-color);
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Visual gallery</strong>
      <span>Theme:</span>
      <span id="themes"></span>
      <a href="./index.html" style="margin-left: auto">← Mock harness</a>
    </header>
    <main id="main"></main>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
